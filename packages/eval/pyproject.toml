[project]
name = "decision-eval"
version = "0.5.0"
description = "Évaluation de l'agent : jeux eval/*.yaml, correcteur (compare), anti-fuite, statistiques, exécuteur, banc de latence."
requires-python = ">=3.12"
dependencies = [
    "decision-core",
    "pyyaml>=6.0",
    "sqlglot~=30.24",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[project.scripts]
decision-eval = "decision_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_eval"]
