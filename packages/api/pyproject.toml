[project]
name = "decision-api"
version = "0.5.0"
description = "API FastAPI minimale : JWT Keycloak, conversations en flux SSE, tableau de bord, back-office en lecture."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "decision-agent",
    "decision-core",
    "fastapi>=0.135",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_api"]

[tool.uv.sources]
decision-core = { workspace = true }
decision-agent = { workspace = true }
