# Migrations du schéma `app`, exécutées avec le rôle app_owner (OWNER_DATABASE_URL).
#   cd packages/api && OWNER_DATABASE_URL=postgresql://app_owner:...@hote/warehouse uv run alembic upgrade head
[alembic]
script_location = %(here)s/src/decision_api/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
