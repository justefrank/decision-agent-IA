[project]
name = "decision-data-gen"
version = "0.5.0"
description = "Générateur de données synthétiques (transactions Wave, Sénégal) chargées par COPY dans le schéma raw."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
decision-data-gen = "decision_data_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_data_gen"]
