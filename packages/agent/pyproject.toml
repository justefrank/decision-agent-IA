[project]
name = "decision-agent"
version = "0.5.0"
description = "Agent IA (Claude) : boucle bornée, outils MCP, registre de faits, validateur, formateur, analyse du tableau de bord."
requires-python = ">=3.12"
dependencies = [
    "decision-core",
    "anthropic>=2.3,<3",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_agent"]
