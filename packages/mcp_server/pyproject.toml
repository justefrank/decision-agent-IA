[project]
name = "decision-mcp-server"
version = "0.5.0"
description = "Serveur MCP (stdio) : query_metric, run_query, describe_schema sur le schéma analytics."
requires-python = ">=3.12"
dependencies = [
    "decision-core",
    "decision-sql-guard",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
decision-mcp-server = "decision_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_mcp_server"]
