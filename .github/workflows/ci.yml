# Intégration continue : tout ce qui est testable sans clé Claude ni Keycloak réel.
#   python    lint, tests de tous les paquets (garde SQL, MCP, agent, API, évaluation), contrats
#   warehouse données factices, dbt (53 tests dont les 6 KPI figés), droits de agent_ro, migrations
#   web       types, lint, tests, build, tests de bout en bout et accessibilité (API simulée)
#   docker    images de l'API et du conteneur outils construites, compose valide
#   secrets   scan des secrets (ENF4)
# Aucun secret n'est nécessaire : les tests de l'agent utilisent un client LLM scripté.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22"

jobs:
  python:
    name: python (lint et tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Dépendances
        run: uv sync --all-packages --frozen
      - name: Lint (ruff)
        run: uv run ruff check packages warehouse/scripts scripts
      - name: Contrats TypeScript à jour (OpenAPI et schémas)
        run: |
          uv run python scripts/gen_openapi.py /tmp/openapi.json
          diff -q /tmp/openapi.json web/src/api/openapi.json \
            || { echo "::error::web/src/api/openapi.json est périmé : lancer make web-api-types"; exit 1; }
      - name: Tests (les tests db démarrent leur propre Postgres jetable)
        run: uv run pytest packages -q -p no:cacheprovider

  warehouse:
    name: données factices, dbt et droits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: make init (Postgres, données à l'échelle 0,05, dbt, droits, migrations)
        run: make init PG_PORT=55432 INIT_SCALE=0.05
      - name: Tests avec la base générée
        run: |
          AGENT_RO_DSN=postgresql://agent_ro:agent_ro@localhost:55432/warehouse \
            uv run pytest packages/mcp_server packages/eval packages/agent -q -p no:cacheprovider
      - name: Références du jeu de test et anti-fuite
        run: |
          uv run python -m decision_eval manifest --verify
          uv run python -m decision_eval antileak
          AGENT_RO_DSN=postgresql://agent_ro:agent_ro@localhost:55432/warehouse \
            uv run python -m decision_eval refs --split test

  web:
    name: web (types, lint, tests, build, e2e, accessibilité)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité (axe-core, WCAG 2.2 AA)
        run: npx playwright test
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    name: images Docker et compose
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Secrets factices pour la validation de compose
        run: make secrets
      - name: Compose valide (base, développement, outils)
        run: |
          docker compose -f infra/compose.yaml --profile dev --profile tools config -q
          docker compose -f infra/compose.yaml -f infra/compose.dev.yaml --profile tools config -q
      - uses: docker/setup-buildx-action@v3
      - name: Image de l'API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          tags: decision-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image du conteneur outils
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/tools.Dockerfile
          tags: decision-tools:ci
          load: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      - name: L'API démarre dans son image (import des modules, sondes)
        run: |
          docker run --rm decision-api:ci python -c \
            "import decision_api.main, decision_mcp_server, decision_agent; print('imports ok')"
      - name: Le conteneur outils voit make, uv, dbt et psql
        run: |
          docker run --rm --entrypoint sh decision-tools:ci -c \
            "make --version | head -1 && uv --version && /opt/dbt/bin/dbt --version | head -3 && psql --version"

  secrets:
    name: scan des secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
