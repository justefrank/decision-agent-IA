  - id: T39
    category: piege_glossaire
    trap: jour_ferie
    question: Quel volume de transactions a été réalisé les jours fériés depuis le début de l'année 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS volume_transactions
      FROM analytics.fact_transaction f
      JOIN analytics.dim_date d ON d.date_id = f.date_id
      WHERE f.statut = 'reussie' AND d.jour_ferie
        AND d.date BETWEEN DATE '2026-01-01' AND DATE '2026-09-30'
    expected_period: {start: 2026-01-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T40
    category: piege_glossaire
    trap: denominateur_taux_echec
    question: Quelle part des retraits a échoué en août 2026 ?
    expected_kind: answer
