      JOIN analytics.dim_agent a ON a.agent_id = f.agent_id
      JOIN analytics.dim_region ra ON ra.region_id = f.region_agent_id
      WHERE f.statut = 'reussie' AND f.type = 'transfert' AND f.agent_id <> -1
        AND ra.region = 'Kédougou' AND f.date_id BETWEEN 20260901 AND 20260930
