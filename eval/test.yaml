      GROUP BY f.type
    expected_period: {start: 2026-07-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T34
    category: suivi
    trap: reponse_a_clarification
    variant: A
    turns:
      - question: Quelle est la valeur transférée par région en septembre 2026 ?
