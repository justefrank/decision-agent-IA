  - id: T36
    category: piege_glossaire
    trap: region_agent_par_defaut
    question: Combien d'agents actifs par région en août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT ra.region, COUNT(DISTINCT f.agent_id) AS agents_actifs
      FROM analytics.fact_transaction f
      JOIN analytics.dim_region ra ON ra.region_id = f.region_agent_id
      WHERE f.statut = 'reussie' AND f.agent_id <> -1
        AND f.date_id BETWEEN 20260801 AND 20260831
      GROUP BY ra.region
    expected_period: {start: 2026-08-01, end: 2026-08-31}
    expected_scope: {region_kind: region_agent, filters: {}}
    tolerate_hors_agent_zero: true

  - id: T37
    category: piege_glossaire
    trap: hors_agent
    question: Quel point de service a généré la plus grande valeur transférée en août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT a.agent_id, a.nom, COALESCE(SUM(f.montant_xof), 0) AS valeur_transferee
      FROM analytics.fact_transaction f
      JOIN analytics.dim_agent a ON a.agent_id = f.agent_id
      WHERE f.statut = 'reussie' AND f.agent_id <> -1
        AND f.date_id BETWEEN 20260801 AND 20260831
      GROUP BY a.agent_id, a.nom
      ORDER BY valeur_transferee DESC, a.agent_id
      LIMIT 1
    expected_period: {start: 2026-08-01, end: 2026-08-31}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [valeur_transferee]
    tie_tolerant: true
    prefix_ok: true
    column_groups: [[agent_id, nom]]

  - id: T38
    category: piege_glossaire
    trap: resultat_vide
    question: Quels agents de la région de Kédougou ont réalisé des transferts en septembre 2026 ?
