# Jeu de TEST (SRS v5 §11) : 40 questions écrites à la main, FIGÉ par hash (eval/MANIFEST).
# Usage : chiffre d'acceptation O1 uniquement (pass^3, Wilson). Jamais alimenté par les signalements.
# Au plus 5 exécutions par jalon ; les échecs ne sont analysés que par catégorie.
# Toute modification invalide le hash : elle exige une nouvelle version justifiée du jeu.
#
# Conventions :
#   - dates relatives à REFERENCE_DATE = 2026-09-30 ; données du 2025-04-01 au 2026-09-30 ;
#   - reference_sql : SQL Postgres sur analytics.* uniquement, exécuté à chaque run avec agent_ro ;
#     aucune valeur attendue n'est écrite ici ;
#   - expected_period : période résolue attendue (comparée après bornage à la fenêtre des données) ;
#   - expected_scope : sens de région attendu et filtres de périmètre (dimensions de query_metric) ;
#   - ordered/order_by/tie_tolerant/prefix_ok : règles de classement (voir packages/eval/README.md).
split: test
reference_date: 2026-09-30
items:
  # ---------------------------------------------------------------- KPI simple (8)
  - id: T01
    category: kpi_simple
    trap: null
    question: Quel est le volume de transactions en septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS volume_transactions
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260901 AND 20260930
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T02
    category: kpi_simple
    trap: null
    question: Quelle a été la valeur transférée totale en août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.montant_xof), 0) AS valeur_transferee
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260801 AND 20260831
    expected_period: {start: 2026-08-01, end: 2026-08-31}
    expected_scope: {filters: {}}

  - id: T03
    category: kpi_simple
    trap: null
    question: Combien avons-nous encaissé de revenus de frais au deuxième trimestre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.frais_xof), 0) AS revenus_frais
      FROM analytics.fact_transaction f
      JOIN analytics.dim_date d ON d.date_id = f.date_id
      WHERE f.statut = 'reussie' AND d.annee = 2026 AND d.trimestre = 2
    expected_period: {start: 2026-04-01, end: 2026-06-30}
    expected_scope: {filters: {}}

  - id: T04
    category: kpi_simple
    trap: periode_relative
    question: Quel est le taux d'échec des transactions ce mois-ci ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) FILTER (WHERE f.statut = 'echouee')::numeric / NULLIF(COUNT(*), 0) AS taux_echec
      FROM analytics.fact_transaction f
      WHERE f.date_id BETWEEN 20260901 AND 20260930
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T05
    category: kpi_simple
    trap: null
    question: Combien de clients actifs avons-nous eu en juillet 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(DISTINCT f.client_id) AS clients_actifs
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260701 AND 20260731
    expected_period: {start: 2026-07-01, end: 2026-07-31}
    expected_scope: {filters: {}}

  - id: T06
    category: kpi_simple
    trap: agent_actif
    question: Combien de points de service étaient actifs en juin 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(DISTINCT f.agent_id) AS agents_actifs
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.agent_id <> -1
        AND f.date_id BETWEEN 20260601 AND 20260630
    expected_period: {start: 2026-06-01, end: 2026-06-30}
    expected_scope: {filters: {}}

  - id: T07
    category: kpi_simple
    trap: null
    question: Quelle est la valeur des dépôts réussis au premier trimestre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.montant_xof), 0) AS valeur_depots
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.type = 'depot'
        AND f.date_id BETWEEN 20260101 AND 20260331
    expected_period: {start: 2026-01-01, end: 2026-03-31}
    expected_scope: {filters: {type: [depot]}}

  - id: T08
    category: kpi_simple
    trap: null
    question: Combien de retraits ont été effectués du 1er au 15 septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS volume_retraits
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.type = 'retrait'
        AND f.date_id BETWEEN 20260901 AND 20260915
    expected_period: {start: 2026-09-01, end: 2026-09-15}
    expected_scope: {filters: {type: [retrait]}}

  # ---------------------------------------------------------------- Comparaison de périodes (6)
  - id: T09
    category: comparaison
    trap: null
    question: Comment a évolué la valeur transférée en septembre 2026 par rapport à août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.montant_xof) FILTER (WHERE f.date_id BETWEEN 20260901 AND 20260930), 0) AS courante,
             COALESCE(SUM(f.montant_xof) FILTER (WHERE f.date_id BETWEEN 20260801 AND 20260831), 0) AS precedente
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie'
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T10
    category: comparaison
    trap: null
    question: Le volume de transactions du troisième trimestre 2026 est-il supérieur à celui du deuxième trimestre ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) FILTER (WHERE d.trimestre = 3) AS t3_2026,
             COUNT(*) FILTER (WHERE d.trimestre = 2) AS t2_2026
      FROM analytics.fact_transaction f
      JOIN analytics.dim_date d ON d.date_id = f.date_id
      WHERE f.statut = 'reussie' AND d.annee = 2026
    expected_period: {start: 2026-07-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T11
    category: comparaison
    trap: denominateur_taux_echec
    question: Compare le taux d'échec de septembre 2026 avec celui de septembre 2025.
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) FILTER (WHERE f.statut = 'echouee' AND f.date_id BETWEEN 20260901 AND 20260930)::numeric
               / NULLIF(COUNT(*) FILTER (WHERE f.date_id BETWEEN 20260901 AND 20260930), 0) AS taux_sept_2026,
             COUNT(*) FILTER (WHERE f.statut = 'echouee' AND f.date_id BETWEEN 20250901 AND 20250930)::numeric
               / NULLIF(COUNT(*) FILTER (WHERE f.date_id BETWEEN 20250901 AND 20250930), 0) AS taux_sept_2025
      FROM analytics.fact_transaction f
      WHERE f.date_id BETWEEN 20250901 AND 20260930
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}

  - id: T12
    category: comparaison
    trap: null
    question: Les revenus de frais ont-ils augmenté entre juillet et août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.frais_xof) FILTER (WHERE f.date_id BETWEEN 20260801 AND 20260831), 0) AS frais_aout,
             COALESCE(SUM(f.frais_xof) FILTER (WHERE f.date_id BETWEEN 20260701 AND 20260731), 0) AS frais_juillet
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie'
    expected_period: {start: 2026-08-01, end: 2026-08-31}
    expected_scope: {filters: {}}

  - id: T13
    category: comparaison
    trap: serie_temporelle
    question: Montre l'évolution mensuelle du nombre de clients actifs d'avril à septembre 2026.
    expected_kind: answer
    reference_sql: |
      SELECT d.debut_mois AS mois, COUNT(DISTINCT f.client_id) AS clients_actifs
      FROM analytics.fact_transaction f
      JOIN analytics.dim_date d ON d.date_id = f.date_id
      WHERE f.statut = 'reussie' AND d.date BETWEEN DATE '2026-04-01' AND DATE '2026-09-30'
      GROUP BY d.debut_mois
      ORDER BY d.debut_mois
    expected_period: {start: 2026-04-01, end: 2026-09-30}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [mois]
    must_cite: []

  - id: T14
    category: comparaison
    trap: null
    question: Quelle est la variation de la valeur des paiements entre le second semestre 2025 et le premier semestre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COALESCE(SUM(f.montant_xof) FILTER (WHERE f.date_id BETWEEN 20260101 AND 20260630), 0) AS s1_2026,
             COALESCE(SUM(f.montant_xof) FILTER (WHERE f.date_id BETWEEN 20250701 AND 20251231), 0) AS s2_2025
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.type = 'paiement'
    expected_period: {start: 2026-01-01, end: 2026-06-30}
    expected_scope: {filters: {type: [paiement]}}

  # ---------------------------------------------------------------- Classement (6)
  - id: T15
    category: classement
    trap: region_client
    question: Quelles sont les 5 régions de clients qui ont généré la plus grande valeur transférée en septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT rc.region, COALESCE(SUM(f.montant_xof), 0) AS valeur_transferee
      FROM analytics.fact_transaction f
      JOIN analytics.dim_region rc ON rc.region_id = f.region_client_id
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260901 AND 20260930
      GROUP BY rc.region
      ORDER BY valeur_transferee DESC, rc.region
      LIMIT 5
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {region_kind: region_client, filters: {}}
    ordered: true
    order_by: [valeur_transferee]
    tie_tolerant: true

  - id: T16
    category: classement
    trap: hors_agent
    question: Quels sont les 10 agents qui ont réalisé le plus de transactions réussies en août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT a.agent_id, a.nom, COUNT(*) AS volume_transactions
      FROM analytics.fact_transaction f
      JOIN analytics.dim_agent a ON a.agent_id = f.agent_id
      WHERE f.statut = 'reussie' AND f.agent_id <> -1
        AND f.date_id BETWEEN 20260801 AND 20260831
      GROUP BY a.agent_id, a.nom
      ORDER BY volume_transactions DESC, a.agent_id
      LIMIT 10
    expected_period: {start: 2026-08-01, end: 2026-08-31}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [volume_transactions]
    tie_tolerant: true
    column_groups: [[agent_id, nom]]

  - id: T17
    category: classement
    trap: null
    question: Classe les types de transaction par volume en septembre 2026.
    expected_kind: answer
    reference_sql: |
      SELECT f.type, COUNT(*) AS volume_transactions
      FROM analytics.fact_transaction f
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260901 AND 20260930
      GROUP BY f.type
      ORDER BY volume_transactions DESC
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [volume_transactions]

  - id: T18
    category: classement
    trap: denominateur_taux_echec
    question: Quelles sont les 3 régions de clients où le taux d'échec a été le plus élevé au troisième trimestre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT rc.region,
             COUNT(*) FILTER (WHERE f.statut = 'echouee')::numeric / NULLIF(COUNT(*), 0) AS taux_echec
      FROM analytics.fact_transaction f
      JOIN analytics.dim_region rc ON rc.region_id = f.region_client_id
      WHERE f.date_id BETWEEN 20260701 AND 20260930
      GROUP BY rc.region
      ORDER BY taux_echec DESC, rc.region
      LIMIT 3
    expected_period: {start: 2026-07-01, end: 2026-09-30}
    expected_scope: {region_kind: region_client, filters: {}}
    ordered: true
    order_by: [taux_echec]
    tie_tolerant: true

  - id: T19
    category: classement
    trap: null
    question: Quel segment de clients rapporte le plus de revenus de frais en 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT c.segment, COALESCE(SUM(f.frais_xof), 0) AS revenus_frais
      FROM analytics.fact_transaction f
      JOIN analytics.dim_client c ON c.client_id = f.client_id
      WHERE f.statut = 'reussie' AND f.date_id BETWEEN 20260101 AND 20261231
      GROUP BY c.segment
      ORDER BY revenus_frais DESC
      LIMIT 1
    expected_period: {start: 2026-01-01, end: 2026-12-31}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [revenus_frais]
    prefix_ok: true

  - id: T20
    category: classement
    trap: agent_actif
    question: Quelles sont les 5 villes qui comptent le plus d'agents actifs en septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT a.ville, COUNT(DISTINCT f.agent_id) AS agents_actifs
      FROM analytics.fact_transaction f
      JOIN analytics.dim_agent a ON a.agent_id = f.agent_id
      WHERE f.statut = 'reussie' AND f.agent_id <> -1
        AND f.date_id BETWEEN 20260901 AND 20260930
      GROUP BY a.ville
      ORDER BY agents_actifs DESC, a.ville
      LIMIT 5
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {}}
    ordered: true
    order_by: [agents_actifs]
    tie_tolerant: true

  # ---------------------------------------------------------------- Clients et agents (4)
  - id: T21
    category: clients_agents
    trap: hors_kpi
    question: Combien de nouveaux clients se sont inscrits en août 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS nouveaux_clients
      FROM analytics.dim_client c
      WHERE c.date_inscription BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
    notes: "Période portée par une colonne de dimension (non extraite dans resolved_state) : non vérifiée."

  - id: T22
    category: clients_agents
    trap: statut_agent
    question: Combien de points de service sont actuellement fermés ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS agents_fermes
      FROM analytics.dim_agent a
      WHERE a.statut_agent = 'ferme' AND a.agent_id <> -1
    notes: Statut administratif courant, sans période (expected_period non vérifié).

  - id: T23
    category: clients_agents
    trap: null
    question: Combien de clients actifs compte le segment commerçant en septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(DISTINCT f.client_id) AS clients_actifs
      FROM analytics.fact_transaction f
      JOIN analytics.dim_client c ON c.client_id = f.client_id
      WHERE f.statut = 'reussie' AND c.segment = 'commercant'
        AND f.date_id BETWEEN 20260901 AND 20260930
    expected_period: {start: 2026-09-01, end: 2026-09-30}
    expected_scope: {filters: {segment: [commercant]}}

  - id: T24
    category: clients_agents
    trap: agent_actif_vs_statut
    question: Combien d'agents ouverts n'ont réalisé aucune transaction réussie en septembre 2026 ?
    expected_kind: answer
    reference_sql: |
      SELECT COUNT(*) AS agents_ouverts_inactifs
      FROM analytics.dim_agent a
      WHERE a.statut_agent = 'ouvert' AND a.agent_id <> -1
        AND NOT EXISTS (
          SELECT 1 FROM analytics.fact_transaction f
          WHERE f.agent_id = a.agent_id AND f.statut = 'reussie'
            AND f.date_id BETWEEN 20260901 AND 20260930)
    expected_period: {start: 2026-09-01, end: 2026-09-30}

  # ---------------------------------------------------------------- Ambiguë ou hors périmètre (6)
  - id: T25
    category: ambigu_hors_perimetre
    trap: kpi_manquant
    question: Comment se porte le réseau en ce moment ?
    expected_kind: clarification

  - id: T26
